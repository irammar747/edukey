security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    # 1. Cómo se hashean las contraseñas
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\Usuario
                property: username
        # used to reload user from session & other features (e.g. switch_user)

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider

            entry_point: App\Security\AppCustomAuthenticator

            # Configuración del Login
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_dashboard # Donde se va tras loguearse
                username_parameter: username
                password_parameter: password

            # Configuración del Logout
            logout:
                path: app_logout
                target: app_login # A dónde va el usuario tras cerrar sesión
            custom_authenticator: App\Security\AppCustomAuthenticator

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                # by default, the feature is enabled by checking a checkbox in the
                # login form, uncomment the following line to always enable it.
                #always_remember_me: true

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    role_hierarchy:
        # El Administrador hereda los permisos de Personal
        ROLE_ADMIN: [ROLE_PERSONAL]
        # El Personal hereda los permisos básicos de un Usuario
        ROLE_PERSONAL: ROLE_USER

    access_control:
        # Permitir que todos vean el login
        - { path: ^/login, roles: PUBLIC_ACCESS }
        # Todos pueden ver su perfil
        - { path: ^/usuario/me, roles: ROLE_USER }
        # ACCIONES SENSIBLES: Solo para Admin
        - { path: ^/usuario/(new|.+/delete), roles: ROLE_ADMIN }
        # GESTIÓN GENERAL: Personal y Admin pueden entrar
        - { path: ^/usuario, roles: ROLE_PERSONAL }
        - { path: ^/departamento, roles: ROLE_PERSONAL }
        - { path: ^/llave, roles: ROLE_PERSONAL }
        - { path: ^/recurso, roles: ROLE_PERSONAL }
        - { path: ^/usuario, roles: ROLE_PERSONAL }
        - { path: ^/tipo/alerta, roles: ROLE_PERSONAL }
        # Cualquier otra ruta requiere estar logueado
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
